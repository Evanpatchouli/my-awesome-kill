[package]
name = "duel-web"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
qa-compare = []
qa-elemental = []
qa-recast = []
qa-qiaoshui = ["duel-core/content-qiaoshui"]
qa-zhongyi = ["duel-core/content-zhongyi"]
qa-phase-skills = ["duel-core/content-phase-skills"]
