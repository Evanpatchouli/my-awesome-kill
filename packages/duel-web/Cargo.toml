qa-mingdian = ["duel-core/content-mingdian"]
qa-xunxun = ["duel-core/content-xunxun"]
qa-vitality = ["duel-core/content-vitality"]

[dependencies]
duel-core = { path = "../duel-core" }
serde_json = "1"
wasm-bindgen = "=0.2.130"
